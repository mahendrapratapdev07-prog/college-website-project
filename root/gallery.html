  <script>
    const filterButtons = [...document.querySelectorAll('.filter-button')];
    const photoCards = [...document.querySelectorAll('.photo-card')];
    const photoCount = document.getElementById('photoCount');
    const categoryNames = {all:'photograph',learning:'Campus & learning photo',events:'Events & culture photo',graduation:'Graduation photo',community:'Community & clubs photo',sports:'Sports photo'};
    function applyFilter(category){
      let visible = 0;
      photoCards.forEach(card=>{const show=category==='all'||card.dataset.category===category;card.hidden=!show;if(show)visible++;});
      filterButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===category)));
      const noun=categoryNames[category]||'photograph';photoCount.textContent=`${visible} ${noun}${visible===1?'':'s'}`;
    }
    filterButtons.forEach(button=>button.addEventListener('click',()=>applyFilter(button.dataset.filter)));
    filterButtons.forEach(button=>{const category=button.dataset.filter;const count=category==='all'?photoCards.length:photoCards.filter(card=>card.dataset.category===category).length;button.querySelector('.filter-count').textContent=`${count}`;});
    const viewer = document.getElementById('lightbox');
    const largePhoto = document.getElementById('largePhoto');
    const caption = document.getElementById('photoCaption');
    function closeViewer(){viewer.classList.remove('open');document.body.classList.remove('modal-open');largePhoto.src='';}
    document.querySelectorAll('.photo-open').forEach(button=>button.addEventListener('click',()=>{const img=button.querySelector('img');largePhoto.src=img.src;largePhoto.alt=img.alt;caption.textContent=img.alt;viewer.classList.add('open');document.body.classList.add('modal-open');viewer.querySelector('.close').focus();}));
    viewer.querySelector('.close').addEventListener('click',closeViewer);
    viewer.addEventListener('click',event=>{if(event.target===viewer)closeViewer();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer();});
  </script>
</body>
</html>
